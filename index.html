<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qunvero — 200+ Free Tools Ek Hi Jagah</title>
<meta name="description" content="Qunvero — India ka #1 Free Tools Website. Bijli Bill, Invoice, GST, EMI, PDF, Image, QR Code — 200+ tools free. No signup needed.">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0a0f;--bg2:#13131c;--card:#1a1a24;--border:rgba(255,255,255,.08);
  --text:#fff;--muted:#8a8a9a;--primary:#0070f3;--accent:#7928ca;
  --success:#10b981;--danger:#ef4444;--warning:#f59e0b;
  --grad:linear-gradient(135deg,#0070f3,#7928ca);
}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle at 15% 15%,rgba(0,112,243,.12),transparent 40%),radial-gradient(circle at 85% 85%,rgba(121,40,202,.12),transparent 40%)}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
input,select,textarea{width:100%;padding:12px 16px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:12px;color:#fff;outline:none;transition:.2s;font-size:15px}
input:focus,select:focus,textarea:focus{border-color:var(--primary);background:rgba(0,112,243,.08)}
input::placeholder,textarea::placeholder{color:var(--muted)}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;font-weight:500}
img{max-width:100%;display:block}
canvas{max-width:100%}

header{position:sticky;top:0;z-index:100;background:rgba(10,10,15,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:12px 16px}
.hdr{max-width:1300px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{font-size:20px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:6px}
.logo span{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hdr-right{display:flex;gap:8px;align-items:center}
.btn{padding:10px 18px;border:none;border-radius:22px;cursor:pointer;font-weight:600;font-size:14px;transition:.2s;white-space:nowrap}
.btn-p{background:var(--grad);color:#fff}
.btn-p:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,112,243,.4)}
.btn-g{background:rgba(255,255,255,.08);color:#fff;border:1px solid var(--border)}
.btn-g:hover{background:rgba(255,255,255,.15)}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:10px}

.search-wrap{max-width:1300px;margin:14px auto 0;padding:0 16px;position:relative}
.search-box{width:100%;padding:16px 55px 16px 22px;font-size:16px;border-radius:30px;background:rgba(255,255,255,.06);border:1.5px solid var(--border)}
.search-icon{position:absolute;right:32px;top:50%;transform:translateY(-50%);font-size:20px;pointer-events:none}
.search-results{position:absolute;top:calc(100% + 6px);left:16px;right:16px;background:var(--card);border:1px solid var(--border);border-radius:16px;max-height:400px;overflow-y:auto;z-index:200;display:none;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.search-results.on{display:block}
.sr-item{padding:14px 20px;cursor:pointer;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);transition:.15s}
.sr-item:last-child{border-bottom:none}
.sr-item:hover{background:rgba(0,112,243,.12)}
.sr-item .ic{font-size:22px}
.sr-item .info{flex:1}
.sr-item .nm{font-weight:600;font-size:14px}
.sr-item .ct{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.sr-empty{padding:30px;text-align:center;color:var(--muted);font-size:14px}

.hero{text-align:center;padding:36px 16px 20px;max-width:900px;margin:0 auto}
.hero h1{font-size:clamp(26px,4.5vw,44px);font-weight:800;line-height:1.15;margin-bottom:10px}
.hero h1 span{background:linear-gradient(90deg,#0070f3,#7928ca,#ff6b35);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:var(--muted);font-size:15px;margin-bottom:6px}

.stats{display:flex;justify-content:center;gap:28px;padding:20px 16px;flex-wrap:wrap;max-width:800px;margin:0 auto}
.stat{text-align:center;min-width:80px}
.stat-n{font-size:22px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stat-l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}

.quick{max-width:1300px;margin:10px auto;padding:0 16px}
.quick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.q-card{background:linear-gradient(135deg,rgba(0,112,243,.14),rgba(121,40,202,.14));border:1px solid var(--border);padding:14px 8px;border-radius:14px;text-align:center;cursor:pointer;transition:.25s}
.q-card:hover{transform:translateY(-4px);border-color:var(--primary)}
.q-card .e{font-size:26px;display:block;margin-bottom:5px}
.q-card .nm{font-size:12px;font-weight:600}

.sec{max-width:1300px;margin:30px auto;padding:0 16px}
.sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px}
.sec-head h2{font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px}
.sec-head h2 .emo{font-size:22px}
.sec-head .cnt{font-size:12px;color:var(--muted);background:rgba(255,255,255,.06);padding:3px 10px;border-radius:20px;margin-left:8px}
.tools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
.tool{background:var(--card);border:1px solid var(--border);padding:16px 12px;border-radius:14px;cursor:pointer;transition:.25s;text-align:center;position:relative}
.tool:hover{transform:translateY(-4px);border-color:var(--primary);background:rgba(0,112,243,.08)}
.tool .ic{font-size:30px;display:block;margin-bottom:8px}
.tool .nm{font-size:13px;font-weight:600;line-height:1.3}

.modal{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.85);backdrop-filter:blur(6px);display:none;overflow-y:auto;padding:16px}
.modal.on{display:block}
.modal-inner{background:var(--bg2);max-width:900px;margin:20px auto;border-radius:20px;border:1px solid var(--border);overflow:hidden;animation:slideUp .3s}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:12px;background:rgba(0,0,0,.2);position:sticky;top:0;z-index:10}
.modal-head h3{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.modal-close{background:rgba(255,255,255,.1);border:none;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;color:#fff}
.modal-close:hover{background:var(--danger)}
.modal-body{padding:20px}
.modal-actions{display:flex;gap:8px;flex-wrap:wrap;padding:16px 20px;border-top:1px solid var(--border);background:rgba(0,0,0,.2)}
.modal-actions .btn{flex:1;min-width:110px;padding:11px 14px;font-size:13px;border-radius:12px}

.result-box{background:linear-gradient(135deg,rgba(16,185,129,.12),rgba(0,112,243,.12));border:1px solid rgba(16,185,129,.3);padding:20px;border-radius:14px;margin-top:16px}
.result-box h4{color:var(--success);font-size:13px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.result-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed rgba(255,255,255,.08);font-size:14px}
.result-row:last-child{border-bottom:none}
.result-row .lb{color:var(--muted)}
.result-row .vl{font-weight:700}
.result-row.total{padding-top:14px;font-size:17px;border-top:2px solid var(--success)}
.result-row.total .vl{color:var(--success)}

.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn-row .btn{flex:1;min-width:130px}

.tbl{width:100%;border-collapse:collapse;margin-top:14px;font-size:13px}
.tbl th,.tbl td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--border)}
.tbl th{background:rgba(0,112,243,.15);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.tbl input{padding:6px 8px;font-size:13px;border-radius:6px}
.tbl td.amt{font-weight:700;color:var(--success);white-space:nowrap}

.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--success);color:#fff;padding:12px 22px;border-radius:30px;font-weight:600;font-size:14px;z-index:1000;opacity:0;transition:.35s;box-shadow:0 10px 30px rgba(0,0,0,.5);pointer-events:none}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}
.toast.err{background:var(--danger)}

.bnav{position:fixed;bottom:0;left:0;right:0;z-index:99;background:rgba(10,10,15,.96);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:none;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
.bnav a{text-align:center;color:var(--muted);font-size:10px;padding:4px 12px;transition:.2s}
.bnav a.on,.bnav a:hover{color:var(--primary)}
.bnav .i{font-size:20px;display:block;margin-bottom:1px}

footer{max-width:1300px;margin:60px auto 100px;padding:30px 16px;text-align:center;border-top:1px solid var(--border);color:var(--muted);font-size:13px}
footer .fl{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;margin-bottom:14px}
footer .fl a{color:var(--primary);cursor:pointer}
footer .contact-btn{background:linear-gradient(135deg,rgba(0,112,243,.15),rgba(121,40,202,.15));border:1px solid var(--border);padding:10px 20px;border-radius:30px;cursor:pointer;color:#fff;font-weight:600;font-size:13px;margin:12px 0;transition:.2s}
footer .contact-btn:hover{border-color:var(--primary);background:rgba(0,112,243,.15)}

#feedbackBtn{position:fixed;bottom:100px;left:20px;width:56px;height:56px;border-radius:50%;border:none;background:linear-gradient(135deg,#10b981,#0070f3);color:white;font-size:24px;cursor:pointer;box-shadow:0 10px 30px rgba(16,185,129,.4);z-index:150;transition:.3s}
#feedbackBtn:hover{transform:scale(1.15) rotate(10deg)}

#feedbackModal{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;animation:fbFade .3s}
@keyframes fbFade{from{opacity:0}to{opacity:1}}
.fb-content{background:#1a1a24;border:1px solid var(--border);border-radius:20px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto;animation:fbSlide .3s}
@keyframes fbSlide{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.fb-header{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#1a1a24;z-index:2}
.fb-header h3{font-size:18px;color:#fff}
.fb-close{background:rgba(255,255,255,.1);border:none;width:34px;height:34px;border-radius:50%;color:#fff;cursor:pointer;font-size:16px}
.fb-close:hover{background:var(--danger)}
.fb-body{padding:22px}
.fb-body label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px;font-weight:500}
.fb-body input,.fb-body textarea,.fb-body select{width:100%;padding:12px 14px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:10px;color:#fff;font-size:14px;outline:none;transition:.2s;font-family:inherit}
.fb-body input:focus,.fb-body textarea:focus,.fb-body select:focus{border-color:var(--primary);background:rgba(0,112,243,.08)}
.fb-footer{padding:16px 22px;border-top:1px solid var(--border);display:flex;gap:10px;position:sticky;bottom:0;background:#1a1a24}
.fb-cancel,.fb-submit{flex:1;padding:12px;border-radius:12px;border:none;font-weight:600;cursor:pointer;font-size:14px;transition:.2s}
.fb-cancel{background:rgba(255,255,255,.1);color:#fff}
.fb-cancel:hover{background:rgba(255,255,255,.2)}
.fb-submit{background:linear-gradient(135deg,#0070f3,#7928ca);color:#fff}
.fb-submit:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,112,243,.4)}

.thank-you{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;z-index:2000;padding:16px;animation:fbFade .3s}
.ty-content{background:#1a1a24;padding:40px 30px;border-radius:20px;max-width:400px;text-align:center;border:1px solid rgba(16,185,129,.3);animation:fbSlide .4s}

#adminPanel{position:fixed;inset:0;background:rgba(0,0,0,.95);backdrop-filter:blur(10px);z-index:1500;overflow-y:auto;padding:20px;animation:fbFade .3s}
.admin-inner{max-width:1100px;margin:0 auto;background:#0a0a0f;border:1px solid var(--border);border-radius:20px;overflow:hidden}
.admin-header{padding:20px 24px;background:linear-gradient(135deg,#0070f3,#7928ca);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.admin-header h2{font-size:22px;color:#fff}
.admin-btn{padding:8px 16px;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:10px;cursor:pointer;font-size:13px;font-weight:600}
.admin-btn:hover{background:rgba(255,255,255,.25)}
.admin-btn.danger{background:rgba(239,68,68,.9);border-color:#ef4444}
.admin-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;padding:20px}
.admin-stat{background:var(--card);border:1px solid var(--border);padding:16px;border-radius:12px;text-align:center}
.admin-stat-val{font-size:26px;font-weight:800;margin-bottom:4px}
.admin-stat-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.admin-tabs{display:flex;gap:6px;padding:0 20px 12px;overflow-x:auto;flex-wrap:nowrap}
.admin-tab{padding:8px 14px;background:var(--card);border:1px solid var(--border);border-radius:10px;color:var(--muted);cursor:pointer;font-size:12px;white-space:nowrap;font-weight:600}
.admin-tab.on{background:var(--grad);color:#fff;border-color:transparent}
.admin-list{padding:0 20px 20px;max-height:60vh;overflow-y:auto}
.admin-fb{background:var(--card);border:1px solid var(--border);padding:16px;border-radius:14px;margin-bottom:12px}
.admin-fb.unread{border-left:3px solid #ef4444;background:rgba(239,68,68,.04)}
.admin-fb-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.admin-fb-cat{font-size:12px;font-weight:700;text-transform:uppercase;color:#0070f3;letter-spacing:.5px}
.admin-fb-new{background:#ef4444;color:#fff;padding:2px 8px;border-radius:8px;font-size:10px;font-weight:700;margin-left:8px}
.admin-fb-user{font-size:13px;color:#a0c8ff;margin-bottom:8px;display:flex;gap:12px;flex-wrap:wrap}
.admin-fb-msg{font-size:14px;line-height:1.6;padding:10px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);word-break:break-word}
.admin-fb-meta{font-size:11px;color:var(--muted);margin:8px 0;display:flex;gap:12px;flex-wrap:wrap}
.admin-fb-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.admin-fb-actions button{padding:6px 12px;background:rgba(255,255,255,.08);border:1px solid var(--border);color:#fff;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600}
.admin-fb-actions button:hover{background:rgba(0,112,243,.2)}
.admin-fb-actions button.danger:hover{background:rgba(239,68,68,.3)}
.admin-footer{padding:16px 20px;border-top:1px solid var(--border);text-align:center;font-size:12px;color:var(--muted)}

@media(max-width:768px){
  .bnav{display:flex}
  body{padding-bottom:70px}
  .hero{padding:26px 14px 10px}
  .stats{gap:16px;padding:14px}
  .stat-n{font-size:18px}
  .modal-inner{margin:8px auto;border-radius:16px}
  .modal-body{padding:16px}
  .tools-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:9px}
  .tool{padding:13px 8px}
  .tool .ic{font-size:24px}
  .tool .nm{font-size:12px}
  #feedbackBtn{bottom:90px;left:15px;width:50px;height:50px;font-size:20px}
  .admin-list{max-height:none}
}
@media(max-width:380px){.tools-grid{grid-template-columns:repeat(2,1fr)}}
@media print{
  body{background:#fff;color:#000}
  header,.bnav,.modal-actions,.modal-close,footer,#feedbackBtn,.no-print{display:none!important}
  .modal{position:static;background:#fff;padding:0}
  .modal-inner{border:none;box-shadow:none;margin:0;border-radius:0}
  .modal-head{background:#fff;border-bottom:2px solid #000;position:static}
  .result-box{background:#f5f5f5;border:2px solid #000;color:#000}
  .tbl th{background:#e0e0e0!important;color:#000}
}
</style>
</head>

<header>
  <div class="hdr">

  <div class="search-wrap">

    <div class="search-results" id="searchRes"></div>

<section class="hero">

  <div class="stat"><div class="stat-n">200+</div><div class="stat-l">Free Tools</div></div>
  <div class="stat"><div class="stat-n">100%</div><div class="stat-l">Private</div></div>
  <div class="stat"><div class="stat-n">0₹</div><div class="stat-l">Forever</div></div>
</div>

<section class="quick">
  <div class="sec-head"><h2><span class="emo">⚡</span>Quick Access</h2></div>

</section>

<div id="categoriesWrap"></div>

<footer>
  <div class="fl">
    <a onclick="goHome()">Home</a>
    <a onclick="openStatic('about')">About</a>
    <a onclick="openStatic('privacy')">Privacy</a>
    <a onclick="openStatic('terms')">Terms</a>
  </div>
  <button class="contact-btn" onclick="feedbackSystem.openForm()">📬 Contact / Feedback</button>
  <p>Made with ❤️ in India • © 2025 Qunvero</p>

<nav class="bnav">

  <a onclick="focusSearch()"><span class="i">🔍</span>Search</a>
  <a onclick="openRandomTool()"><span class="i">🎲</span>Random</a>

<button id="feedbackBtn" onclick="feedbackSystem.openForm()" title="Send Feedback">💬</button>

<div class="modal" id="toolModal" onclick="if(event.target===this)closeTool()">
  <div class="modal-inner">
    <div class="modal-head">
      <h3><span id="toolIcon">🛠️</span> <span id="toolTitle">Tool</span></h3>
      <button class="modal-close" onclick="closeTool()">✕</button>
    </div>
    <div class="modal-body" id="toolBody"></div>
    <div class="modal-actions no-print">
      <button class="btn btn-g" onclick="printTool()">🖨️ Print</button>
      <button class="btn btn-g" onclick="downloadTool()">⬇️ Download</button>
      <button class="btn btn-g" onclick="copyResult()">📋 Copy</button>
      <button class="btn btn-p" onclick="shareTool()">📤 Share</button>
    </div>
  </div>
</div>

<div class="modal" id="staticModal" onclick="if(event.target===this)closeStatic()">
  <div class="modal-inner">
    <div class="modal-head">
      <h3 id="staticTitle">Info</h3>
      <button class="modal-close" onclick="closeStatic()">✕</button>
    </div>
    <div class="modal-body" id="staticBody"></div>
  </div>
</div>

<div class="toast" id="toast">Done!</div>

<script>
/* ============ CONFIG ============ */
const _e = ['aHR0cHM6Ly9mb3Jtc3ByZWUuaW8vZi94eWV6a3d3dw=='];
const FORMSPREE_ENDPOINT = atob(_e[0]);

/* Admin secret key */
const ADMIN_KEY = "qunvero2025";

/* ============ TOAST ============ */
function toast(msg, err){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='toast on'+(err?' err':'');

/* ============ LIVE USERS ============ */
class LiveUsers {
  constructor(){this.tabId=this.getTabId();this.channel=null;this.init();}
  getTabId(){let id=sessionStorage.getItem('et_tab');if(!id){id='tab_'+Math.random().toString(36).slice(2);sessionStorage.setItem('et_tab',id);}return id;}
  init(){
    this.activeUsers=JSON.parse(localStorage.getItem('et_active')||'{}');
    this.activeUsers[this.tabId]=Date.now();
    this.save();
    if('BroadcastChannel' in window){
      this.channel=new BroadcastChannel('et_live');
      this.channel.onmessage=(e)=>{if(e.data.type==='ping'||e.data.type==='join'){this.activeUsers[e.data.id]=Date.now();this.save();}else if(e.data.type==='leave'){delete this.activeUsers[e.data.id];this.save();}};
      this.announce('join');
      setInterval(()=>this.announce('ping'),5000);
      window.addEventListener('beforeunload',()=>this.announce('leave'));
    }
    setInterval(()=>{this.cleanup();this.update();},3000);
    this.update();
  }
  announce(type){if(this.channel)this.channel.postMessage({type,id:this.tabId});}
  cleanup(){const now=Date.now();const fresh={};Object.keys(this.activeUsers).forEach(id=>{if(now-this.activeUsers[id]<30000)fresh[id]=this.activeUsers[id];});this.activeUsers=fresh;this.save();}
  save(){localStorage.setItem('et_active',JSON.stringify(this.activeUsers));}
  getCount(){this.cleanup();const real=Object.keys(this.activeUsers).length;const hour=new Date().getHours();let factor=(hour>=9&&hour<=22)?1.5:(hour>=0&&hour<=6)?0.3:1;const base=Math.floor(8*factor)+Math.floor(Math.random()*5);return base+real;}
  update(){document.querySelectorAll('[data-live-users]').forEach(el=>{el.textContent=this.getCount().toLocaleString('en-IN');});}
}
const liveUsers = new LiveUsers();

/* ============ RENDER ============ */
function renderQuick(){
  const quick=['biz-invoice','elec-bill','biz-emi','biz-gst','txt-count','soc-qr','fin-sip','edu-age'];
  const box=document.getElementById('quickGrid');
  box.innerHTML=quick.map(id=>{const t=TOOLS.find(x=>x.id===id);if(!t)return '';return `<div class="q-card" onclick="openTool('${t.id}')"><span class="e">${t.i}</span><span class="nm">${t.n}</span></div>`;}).join('');
}
function renderCategories(){
  const wrap=document.getElementById('categoriesWrap');
  wrap.innerHTML=CATEGORIES.map(cat=>{const tools=TOOLS.filter(t=>t.c===cat.id);if(!tools.length)return '';return `<section class="sec"><div class="sec-head"><h2><span class="emo">${cat.emo}</span>${cat.name} <span class="cnt">${tools.length}</span></h2></div><div class="tools-grid">${tools.map(t=>`<div class="tool" onclick="openTool('${t.id}')"><span class="ic">${t.i}</span><span class="nm">${t.n}</span></div>`).join('')}</div></section>`;}).join('');
}
function buildCalcFuncs(){TOOLS.forEach(t=>{if(t.calc){window['calc_'+t.id]=()=>{try{const r=t.calc();if(r)window._lastText=r;}catch(e){console.error(e);}};}});}

/* ============ SEARCH ============ */
function doSearch(q){
  const box=document.getElementById('searchRes');
  if(!q||q.length<1){box.classList.remove('on');return;}
  q=q.toLowerCase();
  const results=TOOLS.filter(t=>t.n.toLowerCase().includes(q)||t.id.includes(q)).slice(0,10);
  if(!results.length){box.innerHTML='<div class="sr-empty">😕 Kuch nahi mila</div>';}
  else{box.innerHTML=results.map(t=>{const cat=CATEGORIES.find(c=>c.id===t.c);return `<div class="sr-item" onclick="openTool('${t.id}')"><span class="ic">${t.i}</span><div class="info"><div class="nm">${t.n}</div><div class="ct">${cat?cat.name:''}</div></div><span style="color:#0070f3">→</span></div>`;}).join('');}
  box.classList.add('on');
}
document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap'))document.getElementById('searchRes').classList.remove('on');});
function focusSearch(){document.getElementById('searchBox').focus();window.scrollTo({top:0,behavior:'smooth'});}

/* ============ TOOL OPEN ============ */
function openTool(id){
  const t=TOOLS.find(x=>x.id===id);
  if(!t){toast('Tool not found',1);return;}
  currentToolId=id;
  document.getElementById('toolIcon').textContent=t.i;
  document.getElementById('toolTitle').textContent=t.n;
  document.getElementById('toolBody').innerHTML=t.render();
  document.getElementById('toolModal').classList.add('on');
  document.body.style.overflow='hidden';
  window._lastBlob=null;window._lastText='';window._lastName='result';
  if(t.init)t.init();
  if(t.calc)setTimeout(()=>{try{t.calc();}catch(e){console.error(e);}},50);
}
function closeTool(){document.getElementById('toolModal').classList.remove('on');document.body.style.overflow='';currentToolId='';}
function openRandomTool(){const t=TOOLS[Math.floor(Math.random()*TOOLS.length)];openTool(t.id);}

/* ============ ACTIONS ============ */
function printTool(){window.print();}
function downloadTool(){
  const t=TOOLS.find(x=>x.id===currentToolId);
  const name=(t?t.n:'result').toLowerCase().replace(/\s+/g,'-');
  if(window._lastBlob){downloadBlob(window._lastBlob,window._lastName||(name+'.jpg'));return;}
  const text=window._lastText||(document.getElementById('resultBox')?document.getElementById('resultBox').innerText:'');
  if(!text||text.trim().length<2){toast('Kuch result nahi hai',1);return;}
  downloadBlob(new Blob([text],{type:'text/plain'}),name+'.txt');
}
function downloadBlob(blob,name){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(url),1000);toast('⬇️ Downloaded!');}
async function copyResult(){const text=window._lastText||(document.getElementById('resultBox')?document.getElementById('resultBox').innerText:'');if(!text||text.trim().length<2){toast('Kuch copy karne ko nahi',1);return;}try{await navigator.clipboard.writeText(text);toast('📋 Copied!');}catch(e){toast('Copy failed',1);}}
async function shareTool(){const t=TOOLS.find(x=>x.id===currentToolId);const text=window._lastText||'';const data={title:'Qunvero — '+(t?t.n:''),text:(text?text+'\n\n':'')+'Try Qunvero — 200+ Free Tools!',url:location.href};try{if(navigator.share){await navigator.share(data);}else{await navigator.clipboard.writeText(data.text+' '+data.url);toast('📋 Link copied!');}}catch(e){}}

async function runPdfMerge(){const files=document.getElementById('pdfs').files;if(files.length<2){toast('2+ PDF select karo',1);return;}toast('⏳ Merging...');try{const {PDFDocument}=await import('https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/+esm');const merged=await PDFDocument.create();for(const f of files){const buf=await f.arrayBuffer();const doc=await PDFDocument.load(buf);const pages=await merged.copyPages(doc,doc.getPageIndices());pages.forEach(p=>merged.addPage(p));}const bytes=await merged.save();downloadBlob(new Blob([bytes],{type:'application/pdf'}),'merged.pdf');}catch(e){toast('Merge failed',1);}}
async function runImgToPdf(){const files=document.getElementById('imgs').files;if(!files.length){toast('Images select karo',1);return;}toast('⏳ Converting...');try{const {PDFDocument}=await import('https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/+esm');const doc=await PDFDocument.create();for(const f of files){const buf=await f.arrayBuffer();const img=f.type.includes('png')?await doc.embedPng(buf):await doc.embedJpg(buf);const p=doc.addPage([img.width,img.height]);p.drawImage(img,{x:0,y:0,width:img.width,height:img.height});}downloadBlob(new Blob([await doc.save()],{type:'application/pdf'}),'images.pdf');}catch(e){toast('Failed',1);}}
async function runPdfInfo(){const f=document.getElementById('pdf').files[0];if(!f){toast('PDF select karo',1);return;}try{const {PDFDocument}=await import('https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/+esm');const doc=await PDFDocument.load(await f.arrayBuffer());document.getElementById('resultBox').innerHTML=`<div class="result-box"><h4>ℹ️ PDF Info</h4><div class="result-row"><span class="lb">File</span><span class="vl">${f.name}</span></div><div class="result-row"><span class="lb">Size</span><span class="vl">${(f.size/1024).toFixed(2)} KB</span></div><div class="result-row total"><span class="lb">Pages</span><span class="vl">${doc.getPageCount()}</span></div></div>`;window._lastText=`File: ${f.name}, Pages: ${doc.getPageCount()}`;}catch(e){toast('Failed',1);}}
function runImgCompress(){const f=document.getElementById('file').files[0];if(!f){toast('Image select karo',1);return;}const q=+val('q')/100;const img=new Image();img.src=URL.createObjectURL(f);img.onload=()=>{const c=document.createElement('canvas');c.width=img.width;c.height=img.height;c.getContext('2d').drawImage(img,0,0);c.toBlob(b=>{document.getElementById('resultBox').innerHTML=`<div class="result-box"><h4>✅ Compressed</h4><div class="result-row"><span class="lb">Original</span><span class="vl">${(f.size/1024).toFixed(1)} KB</span></div><div class="result-row total"><span class="lb">Compressed</span><span class="vl">${(b.size/1024).toFixed(1)} KB</span></div><img src="${URL.createObjectURL(b)}" style="margin-top:14px;border-radius:10px;max-height:250px"></div>`;window._lastBlob=b;window._lastName='compressed.jpg';toast('✅ Done!');},'image/jpeg',q);};}
function runImgResize(){const f=document.getElementById('file').files[0];if(!f){toast('Image select karo',1);return;}const img=new Image();img.src=URL.createObjectURL(f);img.onload=()=>{const c=document.createElement('canvas');c.width=+val('w');c.height=+val('h');c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{document.getElementById('resultBox').innerHTML=`<div class="result-box"><h4>✅ Resized</h4><div class="result-row"><span class="lb">Original</span><span class="vl">${img.width}×${img.height}</span></div><div class="result-row total"><span class="lb">New</span><span class="vl">${c.width}×${c.height}</span></div><img src="${URL.createObjectURL(b)}" style="margin-top:14px;border-radius:10px;max-height:250px"></div>`;window._lastBlob=b;window._lastName='resized.jpg';toast('✅ Resized!');},'image/jpeg',0.9);};}
function runPassport(){const f=document.getElementById('file').files[0];if(!f){toast('Photo select karo',1);return;}const sizes={passport:[413,531],stamp:[236,295],visa:[600,600]};const [w,h]=sizes[val('size')];const img=new Image();img.src=URL.createObjectURL(f);img.onload=()=>{const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');const scale=Math.max(w/img.width,h/img.height);const nw=img.width*scale,nh=img.height*scale;ctx.drawImage(img,(w-nw)/2,(h-nh)/2,nw,nh);c.toBlob(b=>{document.getElementById('resultBox').innerHTML=`<div class="result-box"><h4>📸 Passport Photo</h4><div class="result-row"><span class="lb">Size</span><span class="vl">${w}×${h}px</span></div><img src="${URL.createObjectURL(b)}" style="margin-top:14px;border-radius:6px;max-height:200px"></div>`;window._lastBlob=b;window._lastName='passport.jpg';toast('✅ Ready!');},'image/jpeg',0.95);};}
function runImgBase64(){const f=document.getElementById('file').files[0];if(!f){toast('Image select karo',1);return;}const r=new FileReader();r.onload=e=>{document.getElementById('resultBox').innerHTML=`<div class="result-box"><h4>🔤 Base64</h4><textarea rows="8" style="font-size:11px;margin-top:10px" readonly>${e.target.result}</textarea></div>`;window._lastText=e.target.result;toast('✅ Ready!');};r.readAsDataURL(f);}

  const content={
    about:{t:'ℹ️ About Qunvero',b:`<p style="line-height:1.8;font-size:15px">Qunvero is a free online platform offering 200+ useful tools for daily life, business, education, and more.</p><p style="margin-top:14px;line-height:1.8;font-size:15px">All tools run directly in your browser. Your data never leaves your device — 100% private.</p><p style="margin-top:14px;line-height:1.8;font-size:15px">We believe useful tools should be free for everyone.</p>`},
    privacy:{t:'🔒 Privacy Policy',b:`<p style="line-height:1.8;font-size:15px">Your privacy is important to us.</p><ul style="margin:14px 0;padding-left:22px;line-height:1.9;font-size:15px"><li>All processing happens in your browser</li><li>Your files and data never leave your device</li><li>No personal information is collected</li><li>No tracking or third-party cookies</li></ul>`},

  };
  const c=content[page];if(!c)return;
  document.getElementById('staticTitle').textContent=c.t;
  document.getElementById('staticBody').innerHTML=c.b;
  document.getElementById('staticModal').classList.add('on');
  document.body.style.overflow='hidden';
}
function closeStatic(){document.getElementById('staticModal').classList.remove('on');document.body.style.overflow='';}
